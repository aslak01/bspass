name: Build and Release

on:
  push:
    tags:        
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest 

    steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Install X11 
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libx11-dev

    - name: Get dependencies
      run: go mod download

    - name: Build for Linux AMD64
      env:
        GOOS: linux
        GOARCH: amd64
      run: |
        go build -v -o ${{ github.name }}_linux_amd64

    - name: Build for macOS ARM64
      env:
        GOOS: darwin
        GOARCH: arm64
      run: |
        go build -v -o ${{ github.name }}_darwin_arm64

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ github.name }}_linux_amd64
          ${{ github.name }}_darwin_arm64
        generate_release_notes: true 
